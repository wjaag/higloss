# =====================================================================
# HI-GLOSS DESIGN — przekierowania 301 przy przejściu Joomla -> WordPress
#
# GDZIE: główny .htaccess w katalogu webroot, NAD sekcją "# BEGIN WordPress"
# KODOWANIE: UTF-8 bez BOM (reguła 1301 zawiera literę "ł")
# KANON: https://hi-glossdesign.pl (bez www)
# =====================================================================

# ---- 1) Legacy Joomla: /index.php?option=com_* -> strona główna ----
RewriteEngine On
RewriteCond %{QUERY_STRING} (^|&)option=com_
RewriteRule ^index\.php$ https://hi-glossdesign.pl/? [R=301,L]

# ---- 2) Stara paginacja galerii: /galeria?catpage=N -> /galeria/ ----
RewriteCond %{QUERY_STRING} (^|&)catpage=
RewriteRule ^galeria/?$ https://hi-glossdesign.pl/galeria/? [R=301,L]

# ---- 3) Podstrony ofertowe 1:1 (najbliższe odpowiedniki) ----
RedirectMatch 301 ^/oferta/zmiana-koloru-auta/?$  https://hi-glossdesign.pl/zmiana-koloru/
RedirectMatch 301 ^/oferta/oklejanie-aut/?$       https://hi-glossdesign.pl/reklama/
RedirectMatch 301 ^/oferta/usługi-dodatkowe/?$    https://hi-glossdesign.pl/detailing/

# ---- 3b) Stare artykuły Joomla pod /o-firmie/<id>-<slug> ----
# Google trzyma w indeksie stare adresy typu /o-firmie/4-zmiana-koloru-auta
# (stara strona na Joomli). Reguły 1:1 wg słowa kluczowego w slugu + catch-all.
RedirectMatch 301 ^/o-firmie/\d+-zmiana-koloru            https://hi-glossdesign.pl/zmiana-koloru/
RedirectMatch 301 ^/o-firmie/\d+-(ppf|folie-ochronne|bezbarwn) https://hi-glossdesign.pl/ppf/
RedirectMatch 301 ^/o-firmie/\d+-(oklej|reklam|flot)      https://hi-glossdesign.pl/reklama/
RedirectMatch 301 ^/o-firmie/\d+-(szyb|dechrom|detailing|uslugi) https://hi-glossdesign.pl/detailing/
RedirectMatch 301 ^/o-firmie/.+ https://hi-glossdesign.pl/o-firmie/?

# ---- 4) Wyjatki 1:1 dla ZMAPOWANYCH realizacji (NAD regula masowa 4b!) ----
# RedirectMatch bierze pierwsza pasujaca regule — te linie MUSZA znalezc sie
# nad sciezka masowa, zeby wygrac. Te same mapowania sa dodatkowo we wtyczce
# 301 Redirects (warstwa WP, odpala tylko gdy Apache ich nie przechwyci).
RedirectMatch 301 ^/galeria/zmiana-koloru-auta/mercedes-e-klasa-czarna-satyna/?$   https://hi-glossdesign.pl/realizacja/mercedes-klasa-s-bialy-na-czarna-satyna/
RedirectMatch 301 ^/galeria/zmiana-koloru-auta/mercedes-s-klasa-czarna-satyna/?$   https://hi-glossdesign.pl/realizacja/mercedes-klasa-s-bialy-na-czarna-satyna/
RedirectMatch 301 ^/galeria/zmiana-koloru-auta/bmw-x5-czarny-mat/?$                 https://hi-glossdesign.pl/realizacja/bmw-x5-zmiana-koloru-na-coral-blue/
RedirectMatch 301 ^/galeria/zmiana-koloru-auta/bmw-x6-3m-atomic-teal/?$             https://hi-glossdesign.pl/realizacja/bmw-x6-zmiana-koloru-atomic-teal/
RedirectMatch 301 ^/galeria/zmiana-koloru-auta/ford-ranger-zielony-mat/?$           https://hi-glossdesign.pl/realizacja/ford-ranger-zmiana-koloru-na-zielony-mat/
RedirectMatch 301 ^/galeria/zmiana-koloru-auta/mercedes-gle-oklejony-foli-ochronn/?$ https://hi-glossdesign.pl/realizacja/mercedes-gle-ochrona-lakieru-folia-ppf/
RedirectMatch 301 ^/galeria/zmiana-koloru-auta/oklejenie-grafika-samochodowa/?$     https://hi-glossdesign.pl/realizacja/camper-motyw-kitesurfing/

# ---- 4b) Cala stara galeria JoomGallery -> nowa /galeria/ ----
# Łapie: obie kategorie, ~80 stron realizacji, endpointy /galeria/image,
# wszystko co kiedykolwiek wisiało pod /galeria/<coś>.
# Nie łapie samej /galeria/ (nowa strona galerii).
# Końcowe "?" w celu odcina stary query string.
RedirectMatch 301 ^/galeria/.+ https://hi-glossdesign.pl/galeria/?

# ---- 5) Kanonikalizacja: http LUB www -> https bez-www (jeden skok) ----
RewriteCond %{HTTPS} off [OR]
RewriteCond %{HTTP_HOST} ^www\.hi-glossdesign\.pl$ [NC]
RewriteRule ^ https://hi-glossdesign.pl%{REQUEST_URI} [R=301,L,NE]
