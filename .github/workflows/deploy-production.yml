name: Deploy Theme to PRODUCTION (https://hi-glossdesign.pl)

on:
  push:
    branches:
      - arena/01a01ede-higloss
  workflow_dispatch:

jobs:
  web-deploy-prod:
    name: 🚀 Deploy motywu na serwer klienta (cyber_Folks)
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Pobierz kod z gałęzi
        uses: actions/checkout@v4

      - name: 📂 Mirror motywu przez FTPS (LFTP)
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -c "
            set ssl:verify-certificate no;
            set ftp:ssl-allow yes;
            set ftp:passive-mode true;
            open -u '${{ secrets.FTP_PROD_USERNAME }}','${{ secrets.FTP_PROD_PASSWORD }}' '${{ secrets.FTP_PROD_SERVER }}';
            mirror -R --verbose --no-perms --delete ./ '${{ secrets.FTP_PROD_SERVER_DIR || '/public_html/wp/wp-content/themes/higloss/' }}' \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob README.md \
              --exclude-glob seo-migration/ \
              --exclude-glob landing-preview.html \
              --exclude-glob proposal-*.html \
              --exclude-glob preview-*.html;
          "
