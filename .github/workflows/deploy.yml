name: Deploy Theme to Staging (https://higloss.gt.tc)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🚀 Deploy All Theme Files to FTP Server
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync ALL files via LFTP Mirror
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -c "
            set ftp:ssl-allow no;
            set ftp:passive-mode true;
            open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_SERVER }}';
            mirror -R --verbose --no-perms ./ '${{ secrets.FTP_SERVER_DIR || '/htdocs/wp-content/themes/higloss/' }}' \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob README.md \
              --exclude-glob landing-preview.html \
              --exclude-glob proposal-*.html \
              --exclude-glob preview-*.html;
          "
