name: Deploy Theme to Staging (https://higloss.gt.tc)

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🚀 Deploy Theme via FTP to higloss.gt.tc
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync files via FTP
        uses: SamKirsch/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/htdocs/wp-content/themes/higloss/' }}
          protocol: ftp
          port: 21
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*
            **/.github*/**
            **/README.md
            **/landing-preview.html
            **/proposal-*.html
            **/preview-*.html
