# =====================================================================
# HI-GLOSS DESIGN — KOMPLETNY .htaccess webroot (stan: 2026-09-08)
#
# Ten plik to gotowa calosc do wklejenia jako public_html/.htaccess.
# Kodowanie: UTF-8 BEZ BOM (reguly z litera "ł" w sciezkach!).
#
# Bloki LSCACHE / NON_LSCACHE / WordPress / LiteSpeed sa generowane
# automatycznie (wtyczka LiteSpeed Cache + WP) — NIE edytowac ich
# recznie; przy wklejaniu zachowac 1:1.
# Edytowalny jest wylacznie blok "# ===== HI-GLOSS" ... "END HI-GLOSS".
#
# Kolejnosc wazna: LSCACHE -> HI-GLOSS (szczegolowe -> masowe ->
# kanonikalizacja OSTATNIA) -> WordPress -> LiteSpeed.
# Po kazdej zmianie: LiteSpeed Cache -> Toolbox -> Purge All.
# =====================================================================

# BEGIN LSCACHE
## LITESPEED WP CACHE PLUGIN - Do not edit the contents of this block! ##
<IfModule mod_rewrite.c>
RewriteEngine on
RewriteRule litespeed/debug/.*\.log$ - [F,L]
RewriteRule \.litespeed_conf\.dat - [F,L]
</IfModule>
<IfModule LiteSpeed>
CacheLookup on
RewriteRule .* - [E=Cache-Control:no-autoflush]

### marker ASYNC start ###
RewriteCond %{REQUEST_URI} /wp-admin/admin-ajax\.php
RewriteCond %{QUERY_STRING} action=async_litespeed
RewriteRule .* - [E=noabort:1]
### marker ASYNC end ###

### marker DROPQS start ###
CacheKeyModify -qs:fbclid
CacheKeyModify -qs:gclid
CacheKeyModify -qs:utm*
CacheKeyModify -qs:_ga
### marker DROPQS end ###

</IfModule>
## LITESPEED WP CACHE PLUGIN - Do not edit the contents of this block! ##
# END LSCACHE
# BEGIN NON_LSCACHE
## LITESPEED WP CACHE PLUGIN - Do not edit the contents of this block! ##
## LITESPEED WP CACHE PLUGIN - Do not edit the contents of this block! ##
# END NON_LSCACHE
# ===== HI-GLOSS: kanon + legacy Joomla =====
RewriteEngine On

# ---- 1) Stare adresy Joomla z parametrami ----
# (znak "?" na koncu celu jest POPRAWNY w RewriteRule — odcina query string)
RewriteCond %{QUERY_STRING} (^|&)option=com_
RewriteRule ^index\.php$ https://hi-glossdesign.pl/? [R=301,L]
RewriteCond %{QUERY_STRING} (^|&)catpage=
RewriteRule ^galeria/?$ https://hi-glossdesign.pl/galeria/? [R=301,L]

# ---- 2) Stare podstrony ofertowe 1:1 ----
RedirectMatch 301 ^/oferta/zmiana-koloru-auta/?$      https://hi-glossdesign.pl/zmiana-koloru/
RedirectMatch 301 ^/oferta/oklejanie-aut/?$           https://hi-glossdesign.pl/reklama/
RedirectMatch 301 ^/oferta/folie-ochronne-na-auto/?$  https://hi-glossdesign.pl/ppf/
RedirectMatch 301 ^/oferta/usługi-dodatkowe/?$        https://hi-glossdesign.pl/detailing/

# ---- 3) Stare artykuły Joomla pod /o-firmie/<id>-<slug> ----
RedirectMatch 301 ^/o-firmie/\d+-zmiana-koloru                 https://hi-glossdesign.pl/zmiana-koloru/
RedirectMatch 301 ^/o-firmie/\d+-(ppf|folie-ochronne|bezbarwn) https://hi-glossdesign.pl/ppf/
RedirectMatch 301 ^/o-firmie/\d+-(oklej|reklam|flot)           https://hi-glossdesign.pl/reklama/
RedirectMatch 301 ^/o-firmie/\d+-(szyb|dechrom|detailing|uslugi) https://hi-glossdesign.pl/detailing/
# UWAGA: w RedirectMatch (mod_alias) znak "?" bylby LITERALEM — cele bez "?"
RedirectMatch 301 ^/o-firmie/.+ https://hi-glossdesign.pl/o-firmie/

# ---- 4) Wyjątki 1:1: stare realizacje galerii -> nowe realizacje (NAD masą!) ----
RedirectMatch 301 ^/galeria/zmiana-koloru-auta/mercedes-e-klasa-czarna-satyna/?$    https://hi-glossdesign.pl/realizacja/mercedes-klasa-s-bialy-na-czarna-satyna/
RedirectMatch 301 ^/galeria/zmiana-koloru-auta/mercedes-s-klasa-czarna-satyna/?$    https://hi-glossdesign.pl/realizacja/mercedes-klasa-s-bialy-na-czarna-satyna/
RedirectMatch 301 ^/galeria/zmiana-koloru-auta/bmw-x5-czarny-mat/?$                 https://hi-glossdesign.pl/realizacja/bmw-x5-zmiana-koloru-na-coral-blue/
RedirectMatch 301 ^/galeria/zmiana-koloru-auta/bmw-x6-3m-atomic-teal/?$           https://hi-glossdesign.pl/realizacja/bmw-x6-zmiana-koloru-atomic-teal/
RedirectMatch 301 ^/galeria/zmiana-koloru-auta/ford-ranger-zielony-mat/?$           https://hi-glossdesign.pl/realizacja/ford-ranger-zmiana-koloru-na-zielony-mat/
RedirectMatch 301 ^/galeria/zmiana-koloru-auta/mercedes-gle-oklejony-foli-ochronn/?$ https://hi-glossdesign.pl/realizacja/mercedes-gle-ochrona-lakieru-folia-ppf/
RedirectMatch 301 ^/galeria/zmiana-koloru-auta/oklejenie-grafika-samochodowa/?$     https://hi-glossdesign.pl/realizacja/camper-motyw-kitesurfing/

# ---- 5) Cała pozostała stara galeria -> /galeria/ ----
# (bez literala "?" — patrz uwaga przy pkt 3)
RedirectMatch 301 ^/galeria/.+ https://hi-glossdesign.pl/galeria/

# ---- 6) Stara mapa Joomli ----
RedirectMatch 301 ^/sitemap\.xml$ https://hi-glossdesign.pl/wp-sitemap.xml

# ---- 6b) Stary jpg motywu po konwersji na webp (cache Googlebot) ----
# Zrodlo niezalezne od sluga motywu; cel = aktualny katalog motywu.
RedirectMatch 301 ^/wp-content/themes/[^/]+/assets/images/ai_tile2_oferta\.jpg$ https://hi-glossdesign.pl/wp-content/themes/higloss-arena-01a068c1-higloss/assets/images/ai_tile2_oferta.webp

# ---- 8) Stare aktualności Joomla -> archiwum poradnika ----
RedirectMatch 301 ^/aktualnosci/?$ https://hi-glossdesign.pl/category/pytania/
RedirectMatch 301 ^/aktualnosci/.+ https://hi-glossdesign.pl/category/pytania/

# ---- 7) Kanonikalizacja (zawsze OSTATNIA) ----
RewriteCond %{HTTPS} off [OR]
RewriteCond %{HTTP_HOST} ^www\.hi-glossdesign\.pl$ [NC]
RewriteRule ^ https://hi-glossdesign.pl%{REQUEST_URI} [R=301,L,NE]
# ===== END HI-GLOSS =====

# BEGIN WordPress
# Dyrektywy zawarte między „BEGIN WordPress” oraz „END WordPress” są generowane dynamicznie i powinny być modyfikowane tylko za pomocą
# filtrów WordPressa. Zmiany dokonane bezpośrednio tutaj będą nadpisywane.
<IfModule mod_rewrite.c>
RewriteEngine On
RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
RewriteBase /
RewriteRule ^index\.php$ - [L]
RewriteCond %{REQUEST_FILENAME} !-f
RewriteCond %{REQUEST_FILENAME} !-d
RewriteRule . /index.php [L]
</IfModule>

# END WordPress
# BEGIN LiteSpeed
# Dyrektywy zawarte między „BEGIN LiteSpeed” oraz „END LiteSpeed” są generowane dynamicznie i powinny być modyfikowane tylko za pomocą
# filtrów WordPressa. Zmiany dokonane bezpośrednio tutaj będą nadpisywane.
<IfModule Litespeed>
	SetEnv noabort 1
</IfModule>
# END LiteSpeed
